services:
  - type: static
    name: SafaChatWidget
    env: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      # Serve .js, .css, images, and other static assets as-is
      - type: static
        source: /\.(js|css|png|jpg|jpeg|svg|json)$/
      # Rewrite all other requests to index.html (for SPA routing)
      - type: rewrite
        source: /*
        destination: /index.html
